<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="AIR SPEED">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>AIR SPEED</title>
<style>
  :root{ color-scheme:dark; --bg:#000; --fg:#fff; --dim:#8b929c; --line:#23262b; --ok:#3dd69c; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:18px}
  header{display:flex;align-items:baseline;justify-content:space-between}
  h1{margin:0;font-size:15px;letter-spacing:.12em;color:var(--dim);font-weight:600}
  #phase{font-size:13px;color:var(--dim)}
  .main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;
    transition:opacity .2s}
  .main.gone{opacity:0}
  /* 測り終わったら大きい数字は畳む。結果はカードに任せて、上下の真ん中に置く */
  .main[hidden]{display:none}
  .main[hidden] ~ .results{margin-top:auto;margin-bottom:auto}
  #big{font-size:76px;line-height:1;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-2px}
  #unit{font-size:15px;color:var(--dim);letter-spacing:.1em}
  #bar{width:100%;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:var(--fg);transition:width .2s}
  .results{display:flex;flex-direction:column;gap:10px}
  .rows{display:grid;gap:10px}
  .rows.two{grid-template-columns:1fr 1fr}      /* 下り・上り */
  .rows.three{grid-template-columns:repeat(3,1fr)}  /* 応答・ゆらぎ・回線だけ */
  .cell{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .cell small{display:block;font-size:12px;color:var(--dim);letter-spacing:.06em}
  .cell b{font-size:26px;font-weight:400;font-variant-numeric:tabular-nums}
  .cell b span{font-size:13px;color:var(--dim);margin-left:4px}
  .meta{font-size:12px;color:var(--dim);text-align:center;min-height:18px}
  button{width:100%;font:inherit;color:var(--fg);background:#15181c;border:1px solid var(--line);
    border-radius:14px;padding:16px;font-size:16px}
  button:active{background:#1d2126}
  button:disabled{opacity:.5}
</style>
</head>
<body>
  <header><h1>AIR SPEED</h1><span id="phase">準備中</span></header>

  <div class="main" id="live">
    <div id="big">--</div>
    <div id="unit">Mbps</div>
    <div id="bar"><i></i></div>
  </div>

  <div class="results">
    <div class="rows two">
      <div class="cell"><small>下り</small><b id="down">--<span>Mbps</span></b></div>
      <div class="cell"><small>上り</small><b id="up">--<span>Mbps</span></b></div>
    </div>
    <div class="rows three">
      <div class="cell"><small>応答</small><b id="ping">--<span>ms</span></b></div>
      <div class="cell"><small>ゆらぎ</small><b id="jit">--<span>ms</span></b></div>
      <div class="cell"><small>回線だけ</small><b id="best">--<span>ms</span></b></div>
    </div>
  </div>

  <div class="meta" id="meta"></div>
  <button id="again" disabled>もう一度測る</button>

<script>
// 測定先は Cloudflare の公開測定サーバ。国内の拠点に繋がる。
const DOWN = n => `https://speed.cloudflare.com/__down?bytes=${n}`;
const UP   = 'https://speed.cloudflare.com/__up';
const META = 'https://speed.cloudflare.com/meta';
const $ = id => document.getElementById(id);
const fmt = v => v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
const setBig = (v, unit) => { $('big').textContent = v; $('unit').textContent = unit; };
// 大きい数字は「いま測っているもの」専用。終わったら畳む（最後に下りへ巻き戻ると逆走して見える）
const showLive = on => {
  const m = $('live');
  if (on){ m.hidden = false; requestAnimationFrame(() => m.classList.remove('gone')); }
  else { m.classList.add('gone'); setTimeout(() => { m.hidden = true; }, 220); }
};
const setBar = p => { $('bar').firstElementChild.style.width = Math.min(100, p * 100) + '%'; };

// 応答は「測った往復 − サーバ側の処理時間」。Cloudflare が Server-Timing で処理時間を返すので引く。
// 併せてエッジが実測した TCP の往復（cfL4 の min_rtt）も拾う
function serverTiming(res){
  const h = res.headers.get('server-timing') || '';
  let dur = 0;
  for (const m of h.matchAll(/cfSpeed\w+;dur=([\d.]+)/g)) dur += parseFloat(m[1]);
  const l4 = h.match(/min_rtt=(\d+)/);
  return {dur, minRtt: l4 ? parseInt(l4[1], 10) / 1000 : null};
}

async function ping(n = 14){
  await fetch(DOWN(0) + '&r=' + Math.random(), {cache: 'no-store'});   // 1回目は接続の準備が乗るので捨てる
  const t = [], edge = [];
  for (let i = 0; i < n; i++){
    const s = performance.now();
    const res = await fetch(DOWN(0) + '&r=' + Math.random(), {cache: 'no-store'});
    await res.arrayBuffer();
    const st = serverTiming(res);
    const net = Math.max(0, performance.now() - s - st.dur);           // サーバの処理時間を引く
    t.push(net);
    if (st.minRtt) edge.push(st.minRtt);
    setBar((i + 1) / n);
    setBig(Math.round(net), 'ms（応答）');
  }
  // ゆらぎは測った順のまま隣どうしの差、応答は真ん中の値（外れ値に引っぱられない）
  let j = 0;
  for (let i = 1; i < t.length; i++) j += Math.abs(t[i] - t[i-1]);
  const sorted = [...t].sort((a, b) => a - b);
  const mid = sorted[Math.floor(sorted.length / 2)];
  const best = edge.length ? Math.min(...edge) : Math.min(...t);       // 回線だけの往復に近い値
  return {ping: mid, jitter: j / (t.length - 1), best};
}

// 下り: 4本同時に流して合計の流量で測る（1本だけだと速い回線で本来の速度が出ない）。
// 立ち上がりの 2 秒を除いた区間の平均を結果にする
async function download(){
  const N = 4, DUR = 8000, WARM = 2000;
  let bytes = 0, warmBytes = 0, warmAt = 0, stop = false;
  const t0 = performance.now(), ctl = new AbortController();
  const tick = setInterval(() => {
    const ms = performance.now() - t0;
    if (!warmAt && ms >= WARM){ warmAt = ms; warmBytes = bytes; }
    if (ms > 500) setBig(fmt(bytes * 8 / (ms / 1000) / 1e6), 'Mbps（下り）');
    setBar(Math.min(1, ms / DUR));
  }, 150);
  const worker = async () => {
    while (!stop){
      try {
        const res = await fetch(DOWN(25e6) + '&r=' + Math.random(), {cache: 'no-store', signal: ctl.signal});
        const reader = res.body.getReader();
        for (;;){
          const {done, value} = await reader.read();
          if (done) break;
          bytes += value.length;
          if (performance.now() - t0 > DUR){ stop = true; ctl.abort(); break; }
        }
      } catch (_) { break; }
    }
  };
  await Promise.allSettled(Array.from({length: N}, worker));
  clearInterval(tick);
  const ms = performance.now() - t0;
  const useWarm = warmAt && ms > warmAt + 1000;
  const mbps = useWarm ? (bytes - warmBytes) * 8 / ((ms - warmAt) / 1000) / 1e6
                       : bytes * 8 / (ms / 1000) / 1e6;
  return mbps;
}

// 上り: 3本同時に送る
async function upload(){
  const N = 3, DUR = 8000, CHUNK = 4e6;
  let bytes = 0, stop = false;
  const t0 = performance.now();
  const body = new Uint8Array(CHUNK);
  const tick = setInterval(() => {
    const ms = performance.now() - t0;
    if (ms > 800 && bytes) setBig(fmt(bytes * 8 / (ms / 1000) / 1e6), 'Mbps（上り）');
    setBar(Math.min(1, ms / DUR));
  }, 150);
  const worker = async () => {
    while (!stop){
      try {
        await fetch(UP, {method: 'POST', body, cache: 'no-store'});
        bytes += CHUNK;
        if (performance.now() - t0 > DUR) stop = true;
      } catch (_) { break; }
    }
  };
  await Promise.allSettled(Array.from({length: N}, worker));
  clearInterval(tick);
  return bytes * 8 / ((performance.now() - t0) / 1000) / 1e6;
}

async function meta(){
  try {
    const m = await (await fetch(META, {cache: 'no-store'})).json();
    const bits = [m.asOrganization, m.city || m.colo, m.clientIp].filter(Boolean);
    $('meta').textContent = bits.join('  ·  ');
  } catch (_) {}
}

async function run(){
  $('again').disabled = true;
  for (const id of ['down', 'up', 'ping', 'jit', 'best']) $(id).firstChild.nodeValue = '--';
  meta();
  try {
    showLive(true);
    $('phase').textContent = '応答を測っています';
    setBig('--', 'ms（応答）'); setBar(0);
    const p = await ping();
    $('ping').firstChild.nodeValue = p.ping.toFixed(0);
    $('jit').firstChild.nodeValue = p.jitter.toFixed(0);
    $('best').firstChild.nodeValue = p.best.toFixed(0);

    $('phase').textContent = '下りを測っています';
    setBar(0);
    const d = await download();
    $('down').firstChild.nodeValue = fmt(d);

    $('phase').textContent = '上りを測っています';
    setBar(0);
    const u = await upload();
    $('up').firstChild.nodeValue = fmt(u);

    $('phase').textContent = '完了';
    setBar(1); showLive(false);
  } catch (e) {
    $('phase').textContent = '測れませんでした';
    $('meta').textContent = String(e && e.message || e);
    showLive(false);
  }
  $('again').disabled = false;
}

$('again').onclick = run;
run();                                   // 開いたら自動で測り始める
</script>
</body>
</html>
